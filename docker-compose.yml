services:
  db:
    image: postgres:16
    container_name: devtrack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devtrack}
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - devtrack-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtrack} -d ${POSTGRES_DB:-devtrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devtrack-db-data:
