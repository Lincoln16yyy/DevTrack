spring.application.name=devtrack-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:devtrack}
spring.datasource.username=${POSTGRES_USER:devtrack}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
